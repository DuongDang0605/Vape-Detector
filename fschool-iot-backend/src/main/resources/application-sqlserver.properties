spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=FschoolIoT;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:sa}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sqlserver-schema.sql
spring.sql.init.continue-on-error=false

# Dashboard React local.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://fschool-iot-dashboard.dang123123258258.chatgpt.site}
