spring.application.name=FschoolIoTBackend
server.port=8080

# Chay SQL Server/SSMS theo mac dinh. Dung --spring.profiles.active=h2 neu can H2.
spring.profiles.default=sqlserver
spring.jpa.open-in-view=false

# Reject unexpected fields so firmware/backend schema drift is visible immediately.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.time-zone=UTC

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Ghi dong thoi ra console IntelliJ va file de doi chieu su kien BLE sau khi test.
logging.file.name=logs/fschool-iot-backend.log
